openapi: 3.0.3
info:
  title: TVMaze Middleware API
  version: 1.0.0
  description: 'Contrato la api Java/Spring Boot con TVMaze y MongoDB Atlas. Incluye búsqueda,
    detalle con caché persistente y comentarios locales.'
servers:
- url: http://localhost:8080/api
  description: Desarrollo local
tags:
- name: Shows
  description: Búsqueda y consulta de shows.
- name: Commentarios
  description: Comentarios y calificaciones locales de 0 a 5.
security: []
paths:
  /search:
    get:
      tags:
      - Shows
      operationId: searchShows
      summary: Buscar shows por nombre
      description: 'Consulta GET /search/shows?q={search_query} de TVMaze, preserva el orden de
        relevancia y proyecta los campos públicos. Agrega los comentarios locales de cada show. Sin no hay registros devuelve []; sin comentarios
        devuelve comments: []. .'
      parameters:
      - name: search_query
        in: query
        required: true
        description: Criterio de búsqueda obligatorio.
        schema:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
        example: under the dome
      responses:
        '200':
          description: Arreglo de shows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShowSearchResult'
              examples:
                withComments:
                  summary: Resultado ilustrativo con comentarios
                  value:
                  - id: 1
                    name: Under the Dome
                    channel: CBS
                    summary: <p>Ejemplo ilustrativo de sinopsis.</p>
                    genres:
                    - Drama
                    - Science-Fiction
                    comments:
                    - &id001
                      comment: Muy buena serie
                      rating: 4.5
                empty:
                  summary: Sin coincidencias
                  value: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /show/{show_id}:
    get:
      tags:
      - Shows
      operationId: getShow
      summary: Obtener show completo con caché y comentarios
      description: Primero consulta la caché de MongoDB por show_id. Si existe, usa su payload sin consultar
        TVMaze. Si no existe, consulta GET /shows/{show_id}, guarda en Mongo y 
        después responde. En ambos casos consulta por separado los
        comentarios actuales y los agrega. Los comentarios
        no se guardan dentro del payload de caché. La respuesta es el objeto show.
      parameters:
      - $ref: '#/components/parameters/ShowId'
      responses:
        '200':
          description: Objeto completo del proveedor, enriquecido con comments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Show'
              examples:
                withComments:
                  summary: Show completo.
                  value:
                    id: 1
                    url: https://www.tvmaze.com/shows/1/under-the-dome
                    name: Under the Dome
                    type: Scripted
                    language: English
                    genres:
                    - Drama
                    - Science-Fiction
                    status: Ended
                    runtime: 60
                    averageRuntime: 60
                    premiered: '2013-06-24'
                    ended: '2015-09-10'
                    officialSite: null
                    schedule:
                      time: '22:00'
                      days:
                      - Thursday
                    rating:
                      average: 6.5
                    weight: 90
                    network:
                      id: 2
                      name: CBS
                      country:
                        name: United States
                        code: US
                        timezone: America/New_York
                      officialSite: null
                    webChannel: null
                    dvdCountry: null
                    externals:
                      tvrage: 25988
                      thetvdb: 264492
                      imdb: tt1553656
                    image: null
                    summary: <p>Ejemplo ilustrativo de sinopsis.</p>
                    updated: 1700000000
                    _links:
                      self:
                        href: https://api.tvmaze.com/shows/1
                    comments:
                    - *id001
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /comments:
    post:
      tags:
      - Commentarios
      operationId: createComment
      summary: Guardar comentario y calificación de un show
      description: Comprueba que el show exista. Guarda cada comentario en una colección independiente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
            example:
              show_id: 1
              comment: Muy buena serie
              rating: 4.5
      responses:
        '201':
          description: Comentario y calificación guardados correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentCreated'
              examples:
                created:
                  value:
                    status: created
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    ShowId:
      name: show_id
      in: path
      required: true
      description: Identificador positivo del show en TVMaze.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1
  schemas:
    Comment:
      type: object
      properties:
        comment:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
        rating:
          type: number
          minimum: 0
          maximum: 5
      required:
      - comment
      - rating
      additionalProperties: false
    CreateCommentRequest:
      type: object
      properties:
        show_id:
          type: integer
          format: int64
          minimum: 1
        comment:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
          description: Debe contener al menos un carácter que no sea espacio. Se guarda como texto.
        rating:
          type: number
          minimum: 0
          maximum: 5
          description: Se admiten decimales y los extremos 0 y 5.
      required:
      - show_id
      - comment
      - rating
      additionalProperties: false
    CommentCreated:
      type: object
      properties:
        status:
          type: string
          enum:
          - created
      required:
      - status
      additionalProperties: false
    ShowSearchResult:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        channel:
          type: string
          nullable: true
          description: network.name.
        summary:
          type: string
          nullable: true
          description: Contenido original.
        genres:
          type: array
          items:
            type: string
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
      required:
      - id
      - name
      - channel
      - summary
      - genres
      - comments
      additionalProperties: false
    Country:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        timezone:
          type: string
      nullable: true
      additionalProperties: true
    Channel:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        country:
          $ref: '#/components/schemas/Country'
        officialSite:
          type: string
          nullable: true
      nullable: true
      additionalProperties: true
    Image:
      type: object
      properties:
        medium:
          type: string
        original:
          type: string
      nullable: true
      additionalProperties: true
    Link:
      type: object
      properties:
        href:
          type: string
          format: uri
        name:
          type: string
      additionalProperties: true
    Show:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        url:
          type: string
          format: uri
        name:
          type: string
        type:
          type: string
        language:
          type: string
          nullable: true
        genres:
          type: array
          items:
            type: string
        status:
          type: string
        runtime:
          type: integer
          nullable: true
        averageRuntime:
          type: integer
          nullable: true
        premiered:
          type: string
          format: date
          nullable: true
        ended:
          type: string
          format: date
          nullable: true
        officialSite:
          type: string
          nullable: true
        schedule:
          type: object
          properties:
            time:
              type: string
            days:
              type: array
              items:
                type: string
          additionalProperties: true
        rating:
          type: object
          properties:
            average:
              type: number
              nullable: true
          additionalProperties: true
          description: Calificación original.
        weight:
          type: integer
        network:
          $ref: '#/components/schemas/Channel'
        webChannel:
          $ref: '#/components/schemas/Channel'
        dvdCountry:
          $ref: '#/components/schemas/Country'
        externals:
          type: object
          properties:
            tvrage:
              type: integer
              format: int64
              nullable: true
            thetvdb:
              type: integer
              format: int64
              nullable: true
            imdb:
              type: string
              nullable: true
          additionalProperties: true
        image:
          $ref: '#/components/schemas/Image'
        summary:
          type: string
          nullable: true
        updated:
          type: integer
          format: int64
          description: Fecha proporcionada por TVMaze.
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
      required:
      - id
      - name
      - comments
      additionalProperties: true
      description: Objeto shows  más commentarios. Se mantienen todos los campos
        originales.
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      required:
      - field
      - message
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      required:
      - type
      - title
      - status
      - detail
      additionalProperties: true
      description: Errores        de validación. 
  responses:
    BadRequest:
      description: Parámetros inválidos, JSON mal formado o campos obligatorios faltantes.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: Parámetros inválidos, JSON mal formado o campos obligatorios ausentes.
    NotFound:
      description: No existe un show con el ID solicitado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: No existe un show con el ID solicitado.
    UnsupportedMediaType:
      description: El cuerpo debe enviarse como application/json.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unsupported Media Type
            status: 415
            detail: El cuerpo debe enviarse como application/json.
    BadGateway:
      description: TVMaze devolvió un error inesperado o una respuesta no válida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Gateway
            status: 502
            detail: TVMaze devolvió un error inesperado o una respuesta no válida.
    ServiceUnavailable:
      description: MongoDB no está disponible o TVMaze rechazó  la petición.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            detail: MongoDB no está disponible o TVMaze rechazó la petición.
    GatewayTimeout:
      description: No fue posible establecer conexión u obtener respuesta de TVMaze dentro del tiempo
        configurado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Gateway Timeout
            status: 504
            detail: No fue posible establecer conexión u obtener respuesta de TVMaze dentro del tiempo
              configurado.
    InternalServerError:
      description: Ocurrió un error interno inesperado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            detail: Ocurrió un error interno inesperado.
